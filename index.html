<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KerWork 资料库 · 原型 v9</title>
<link rel="icon" href="data:,"/>
<style>
:root {
  --bg: #f6f6f8;
  --card: #ffffff;
  --text: #1a1a1e;
  --muted: #82828a;
  --line: #ebebee;
  --line-soft: #f1f1f4;
  --side-bg: #fbfbfc;
  --hover: #f2f2f4;
  --accent: #0eb579;
  --accent-deep: #0c9e6a;
  --accent-soft: rgba(14,181,121,.09);
  --side-w: 248px;
  --kb-w: 264px;
  --ease: cubic-bezier(.32,.72,.28,1);
  --sh-sm: 0 1px 2px rgba(22,22,28,.04), 0 1px 6px rgba(22,22,28,.03);
  --sh-md: 0 2px 6px rgba(22,22,28,.05), 0 8px 24px rgba(22,22,28,.07);
  --sh-lg: 0 4px 12px rgba(22,22,28,.06), 0 16px 48px rgba(22,22,28,.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 14px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(30,30,40,.14); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: rgba(30,30,40,.26); }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }
.hidden { display: none !important; }
.app { display: flex; height: 100vh; }

/* ============ Sidebar ============ */
.sidebar {
  width: var(--side-w); flex-shrink: 0;
  background: var(--side-bg);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 12px 10px; gap: 4px;
}
.sidebar-top { display: flex; justify-content: flex-end; padding: 0 4px 8px; }
.collapse-btn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.collapse-btn:hover { background: var(--hover); color: var(--text); }
.new-task-btn {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 9px 12px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--sh-sm);
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
.new-task-btn:hover { border-color: #d9d9de; box-shadow: var(--sh-md); transform: translateY(-1px); }
.new-task-btn:active { transform: scale(.98); }
.new-task-btn svg { flex-shrink: 0; color: var(--muted); }
.nav-list { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; }
.nav-item {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border-radius: 9px;
  font-size: 13.5px; color: #55555c; font-weight: 500;
  transition: background .15s var(--ease), color .15s var(--ease);
  cursor: pointer;
}
.nav-item:hover { background: var(--hover); color: var(--text); }
.nav-item.active { background: #ececef; color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(22,22,28,.03); }
.nav-item svg { flex-shrink: 0; color: var(--muted); }
.nav-item.active svg { color: var(--accent); }
.sidebar-section { margin-top: 18px; }
.section-label { font-size: 11.5px; color: var(--muted); padding: 0 10px 6px; letter-spacing: .5px; }
.task-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 8px;
  font-size: 13.5px; color: #555;
  transition: background .12s; cursor: pointer;
}
.task-item:hover { background: var(--hover); }
.task-item svg { flex-shrink: 0; color: var(--muted); }
.sidebar-bottom { margin-top: auto; }
.user-profile { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; transition: background .12s; cursor: pointer; }
.user-profile:hover { background: var(--hover); }
.user-avatar { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #3ddc84, #10c07a); }
.user-name { font-size: 13.5px; color: #444; font-weight: 500; }
.settings-icon { margin-left: auto; color: var(--muted); }

/* ============ Topbar ============ */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar {
  height: 52px; flex-shrink: 0;
  display: flex; align-items: center; padding: 0 18px;
  background: var(--card); border-bottom: 1px solid var(--line);
}
.topbar-title { font-size: 13.5px; font-weight: 600; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.topbar-icon-btn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.topbar-icon-btn:hover { background: var(--hover); }
/* ============ 资料库：上下排列（v9） ============ */
.kb-page { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--card); }
.kb-head { display: flex; align-items: center; gap: 14px; padding: 24px 28px 0; }
.kb-title { font-size: 23px; font-weight: 700; letter-spacing: -.2px; }
.kb-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; letter-spacing: .1px; }
.kb-head-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.kb-search {
  display: flex; align-items: center; gap: 7px;
  width: 250px; height: 34px;
  background: var(--hover); border: 1px solid transparent;
  border-radius: 10px; padding: 0 10px;
  transition: background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.kb-search:hover { background: #ededf0; }
.kb-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--card); }
.kb-search svg { color: var(--muted); flex-shrink: 0; }
.kb-search input { border: none; outline: none; background: transparent; width: 100%; font-size: 12.5px; }
.kb-new-btn {
  display: flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 16px; border-radius: 10px;
  background: linear-gradient(180deg, #14c683, var(--accent)); color: #fff; font-size: 13px; font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 3px rgba(14,181,121,.32);
  transition: filter .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
}
.kb-new-btn:hover { filter: brightness(1.05); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 3px 10px rgba(14,181,121,.36); transform: translateY(-1px); }
.kb-new-btn:active { transform: scale(.97); filter: brightness(.98); }
.kb-toolbar { display: flex; align-items: center; gap: 6px; padding: 18px 28px 12px; flex-wrap: wrap; }
.kb-tab { height: 32px; padding: 0 14px; border-radius: 9px; font-size: 13px; font-weight: 500; color: #55555c; transition: background .16s var(--ease), color .16s var(--ease), box-shadow .16s var(--ease); }
.kb-tab:hover { background: var(--hover); }
.kb-tab.on { background: #ececef; color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px rgba(22,22,28,.03); }
.kb-tab.weak { color: #9a9aa0; }
.kb-tab .cnt { font-size: 11px; color: var(--muted); margin-left: 5px; font-weight: 400; font-variant-numeric: tabular-nums; }
.kb-toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.kb-sort {
  display: flex; align-items: center; gap: 5px;
  height: 30px; padding: 0 11px;
  border: 1px solid var(--line); border-radius: 9px;
  font-size: 12px; color: #44444b; background: var(--card);
  flex-shrink: 0;
  transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.kb-sort:hover { border-color: #d6d6db; box-shadow: var(--sh-sm); }
.kb-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 28px 32px; }
.kb-tablehead, .kb-row { display: grid; grid-template-columns: minmax(0, 2.2fr) 1.2fr 1fr 1fr; gap: 12px; align-items: center; }
.kb-sort.on { border-color: var(--accent); color: var(--accent-deep); background: var(--accent-soft); }
.kb-tablehead { padding: 9px 14px; font-size: 11.5px; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
.kb-list { border-top: none; padding: 2px 8px 8px; }
.kb-list.wk .kb-row { opacity: .8; }
.kb-list.wk .kb-row:hover { opacity: 1; }
.kb-row { padding: 10px 14px; border-radius: 10px; cursor: pointer; transition: background .14s var(--ease); }
.kb-row:hover { background: #f4f4f6; }
.kb-row:active { background: #ededf0; }
.kb-row.sub { padding-left: 38px; }
.kb-row.lv2 { padding-left: 58px; }
.c-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.c-name .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; font-weight: 500; }
.c-td { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.c-inline { display: flex; gap: 2px; margin-left: 6px; opacity: 0; transition: opacity .12s; }
.kb-row:hover .c-inline { opacity: 1; }
.c-mid { display: flex; gap: 2px; justify-content: flex-end; padding-right: 28px; opacity: 0; transition: opacity .12s; }
.kb-row:hover .c-mid { opacity: 1; }
.kb-ic-btn { width: 28px; height: 28px; border: none; background: none; border-radius: 7px; display: grid; place-items: center; color: #7a7a80; transition: background .12s, color .12s; flex-shrink: 0; }
.kb-ic-btn:hover { background: #ececee; color: var(--text); }
.kb-ic-btn.star { color: #c2c2c6; }
.kb-ic-btn.star:hover { color: var(--text); }
.kb-ic-btn.star.on { color: #f5a623; }
.file-ic { display: grid; place-items: center; border-radius: 7px; color: #fff; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.kb-fic { width: 26px; height: 26px; border-radius: 7px; background: #fff7e0; display: grid; place-items: center; font-size: 14px; flex-shrink: 0; }
.ver-chip { font-size: 9.5px; color: #0a7d52; background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; font-weight: 600; flex-shrink: 0; }
.kb-grp-row { display: flex; align-items: center; gap: 8px; padding: 14px 4px 8px; font-size: 13.5px; font-weight: 600; color: #333; cursor: pointer; user-select: none; }
.kb-grp-row .chev { color: var(--muted); transition: transform .15s; }
.kb-grp-row.closed .chev { transform: rotate(-90deg); }
.kb-grp-row .cnt-chip { font-size: 11px; color: var(--muted); background: #f0f0f2; padding: 2px 9px; border-radius: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
.kb-grp-row.conv { padding: 6px 4px 4px 38px; font-size: 12.5px; }
.kb-grp-row:hover .c-inline { opacity: 1; }
.vt-group { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.vt-btn { width: 26px; height: 26px; border: none; background: none; border-radius: 7px; display: grid; place-items: center; color: #9a9aa0; transition: background .12s, color .12s; }
.vt-btn:hover { color: var(--text); }
.vt-btn.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 14px; }
.g-card {
  position: relative; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 16px 14px 12px; cursor: pointer;
  box-shadow: var(--sh-sm);
  transition: box-shadow .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
}
.g-card:hover { border-color: #dcdce1; box-shadow: var(--sh-md); transform: translateY(-2px); }
.g-card.open { border-color: var(--accent); }
.g-ic { margin-bottom: 10px; }
.g-name { font-size: 13px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.g-meta { font-size: 11px; color: var(--muted); margin-top: 5px; }
.g-star { position: absolute; top: 10px; right: 10px; color: #f5a623; border: none; background: none; padding: 2px; cursor: pointer; }
.g-star.off { color: #d8d8dc; }
.g-card:hover .g-star.off { color: #b0b0b5; }
.g-acts { display: flex; gap: 2px; margin-top: 8px; opacity: 0; transition: opacity .12s; }
.g-card:hover .g-acts { opacity: 1; }
.kb-detail { background: var(--side-bg); border-bottom: 1px solid var(--line-soft); padding: 6px 0; border-radius: 10px; }
.kb-empty { text-align: center; padding: 60px 12px; color: var(--muted); font-size: 12.5px; }
.kb-empty-title { font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.kb-empty-desc { margin-bottom: 18px; }
.kb-empty-btn { height: 31px; padding: 0 18px; border-radius: 9px; border: none; background: linear-gradient(180deg, #14c683, var(--accent)); color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 3px rgba(14,181,121,.32); transition: filter .15s var(--ease), transform .15s var(--ease); }
.kb-empty-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
.kb-empty-btn:active { transform: scale(.97); }
.kb-empty-ic { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--hover); color: #a5a5ad; margin-bottom: 14px; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* ============ 菜单 ============ */
.menu {
  position: fixed; z-index: 180;
  background: rgba(255,255,255,.88); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  border: 1px solid rgba(22,22,28,.07);
  border-radius: 12px; box-shadow: var(--sh-lg);
  padding: 5px; min-width: 160px;
  opacity: 0; pointer-events: none; transform: translateY(-4px) scale(.98);
  transition: opacity .14s var(--ease), transform .14s var(--ease);
}
.menu.show { opacity: 1; pointer-events: auto; transform: none; }
.menu-item {
  display: flex; align-items: center; gap: 9px;
  width: 100%; padding: 7px 10px; border-radius: 8px;
  font-size: 12.5px; color: #333338; text-align: left;
  transition: background .1s var(--ease);
}
.menu-item:hover { background: var(--hover); }
.menu-item svg { color: var(--muted); flex-shrink: 0; }
.menu-label { font-size: 10.5px; color: var(--muted); padding: 6px 10px 3px; }
.menu-sep { height: 1px; background: var(--line); margin: 4px 8px; }
/* ============ Toast ============ */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translate(-50%, -60px);
  background: rgba(26,26,32,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  color: #fff; font-size: 13px;
  padding: 9px 18px; border-radius: 12px;
  box-shadow: var(--sh-lg);
  transition: transform .28s cubic-bezier(.2,.9,.3,1.15);
  z-index: 150;
}
.toast.show { transform: translate(-50%, 0); }

/* ============ 新建任务（输入框引用态） ============ */
.home-wrap { max-width: 620px; margin: 70px auto 0; }
.home-title { font-size: 25px; text-align: center; font-weight: 600; margin-bottom: 26px; letter-spacing: .3px; }
.home-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}
.chip-area { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-area:empty { display: none; }
.att-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 9px 12px;
  box-shadow: 0 1px 5px rgba(0,0,0,.05);
  animation: chipIn .2s ease;
}
@keyframes chipIn { from { opacity: 0; transform: scale(.9); } }
.att-icon { width: 34px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.att-txt { min-width: 0; }
.att-name { font-size: 12.5px; font-weight: 600; max-width: 200px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.att-ext { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.att-x {
  width: 17px; height: 17px; border-radius: 50%;
  background: #e3e3e6; color: #666;
  display: grid; place-items: center; font-size: 10px;
}
.att-x:hover { background: #d0d0d5; }
.att-plus { color: var(--muted); padding: 8px 2px 2px; }
.home-input { display: flex; align-items: center; gap: 8px; padding-top: 8px; margin-top: 4px; border-top: 1px solid #f0f0f2; }

/* ============ 对话页（任务进行中） ============ */
#homePage { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.chat-page { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat-title { padding: 20px 26px 4px; font-size: 15px; font-weight: 600; }
.chat-msgs { flex: 1; overflow-y: auto; padding: 18px 26px 12px; display: flex; flex-direction: column; gap: 16px; max-width: 860px; width: 100%; margin: 0 auto; }
.msg-user {
  align-self: flex-end; max-width: 70%;
  background: #2b2b2e; color: #fff;
  font-size: 13.5px; line-height: 1.6;
  padding: 9px 14px; border-radius: 14px 14px 4px 14px;
}
.msg-ai { align-self: flex-start; font-size: 13.5px; line-height: 1.9; color: #333; max-width: 85%; }
.msg-work { align-self: flex-start; display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); }
.msg-rag { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.msg-rag svg { color: var(--accent); flex-shrink: 0; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.file-card {
  align-self: stretch; display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 16px;
}
.chat-ow {
  margin-left: auto; flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 13px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card);
  font-size: 12px; color: #333;
}
.chat-ow:hover { border-color: #ccc; background: #fafafa; }
.chat-dock { flex-shrink: 0; padding: 10px 26px 14px; max-width: 860px; width: 100%; margin: 0 auto; }
.chat-input {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.05);
}
.chat-input:focus-within { border-color: #c9c9ce; }
.chat-input input { flex: 1; border: none; outline: none; font-size: 14px; background: transparent; }
.chat-plus { color: var(--muted); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; }
.chat-plus:hover { background: var(--hover); }
.chat-send { width: 32px; height: 32px; border-radius: 50%; background: #1d1d1f; color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.chat-send:hover { background: #000; }
.chat-send.stop { font-size: 11px; }
.chat-foot { text-align: center; font-size: 11px; color: #c2c2c6; padding-top: 10px; }

/* ============ 沉淀提示条（对话框上方） ============ */
.ask-banner {
  position: fixed; bottom: 128px; z-index: 140;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,.08);
  font-size: 12px; color: #444;
  transition: transform .2s, opacity .2s;
  max-width: 60vw;
}
.ask-banner.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.bn-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bn-btn { height: 26px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 11.5px; color: #333; flex-shrink: 0; }
.bn-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ============ 偏好设置 ============ */
.set-wrap { max-width: 720px; margin: 0 auto; padding: 26px 26px 40px; width: 100%; overflow-y: auto; }
.set-back { font-size: 13px; color: var(--muted); padding: 6px 10px; border-radius: 8px; margin-left: -10px; }
.set-back:hover { background: var(--hover); color: var(--text); }
.set-h2 { font-size: 19px; font-weight: 700; margin: 18px 0 12px; }
.set-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
.set-row { display: flex; align-items: center; gap: 16px; }
.set-name { font-size: 14px; font-weight: 600; }
.set-desc { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 520px; line-height: 1.6; }
.tg-switch { width: 40px; height: 22px; border-radius: 20px; background: #dcdce0; position: relative; flex-shrink: 0; margin-left: auto; transition: background .18s; }
.tg-switch.on { background: var(--accent); }
.tg-dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .18s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.tg-switch.on .tg-dot { left: 20px; }

/* ============ 资料库挑选浮层 ============ */
.picker-mask { position: fixed; inset: 0; z-index: 160; background: rgba(0,0,0,.28); display: grid; place-items: center; }
.picker-mask.hidden { display: none !important; }
.picker {
  width: 480px; max-width: 92vw; height: 560px; max-height: 84vh;
  background: var(--card); border-radius: 16px;
  box-shadow: 0 16px 50px rgba(0,0,0,.2);
  display: flex; flex-direction: column; overflow: hidden;
  animation: detailIn .18s ease;
}
.picker-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; }
.picker-title { font-size: 15px; font-weight: 700; }
.picker-search {
  display: flex; align-items: center; gap: 7px;
  margin: 6px 18px 10px; height: 34px;
  background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 0 10px;
}
.picker-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--card); }
.picker-search svg { color: var(--muted); flex-shrink: 0; }
.picker-search input { border: none; outline: none; background: transparent; width: 100%; font-size: 12.5px; }
.picker-body { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
.picker-sec { font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 10px 6px 4px; }
.picker-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px;
  cursor: pointer; transition: background .1s;
}
.picker-row:hover { background: var(--hover); }
.picker-row.on { background: var(--accent-soft); }
.pk-name { font-size: 13px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pk-ext { font-size: 10.5px; color: var(--muted); }
.pk-check { margin-left: auto; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; color: var(--accent); border: 1px solid var(--line); flex-shrink: 0; }
.picker-row.on .pk-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.picker-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.pk-cnt { font-size: 12px; color: var(--muted); margin-right: auto; }

/* ============ 预览弹窗 ============ */
.pv-mask { position: fixed; inset: 0; z-index: 160; background: rgba(22,22,28,.38); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; }
.pv-mask.hidden { display: none !important; }
.pv-win { width: min(880px, 92vw); height: min(660px, 86vh); background: var(--card); border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,.28); display: flex; flex-direction: column; overflow: hidden; animation: pvIn .2s var(--ease); }
@keyframes pvIn { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.pv-titlebar { height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line-soft); }
.pv-fic { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: #fff; font-size: 8.5px; font-weight: 700; flex-shrink: 0; }
.pv-name { font-size: 13px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pv-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.pv-btn { height: 28px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 12px; cursor: pointer; transition: background .14s var(--ease), box-shadow .14s var(--ease), filter .14s var(--ease); }
.pv-btn:hover { background: var(--hover); }
.pv-btn.primary { background: linear-gradient(180deg, #14c683, var(--accent)); border-color: transparent; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 3px rgba(14,181,121,.3); }
.pv-btn.primary:hover { filter: brightness(1.05); }
.pv-x { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); transition: background .14s var(--ease), color .14s var(--ease); flex-shrink: 0; }
.pv-x:hover { background: var(--hover); color: var(--text); }
.pv-paper { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 30px 24px; background: var(--bg); }
.pv-doc { width: 640px; min-height: 760px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 10px 32px rgba(0,0,0,.07); border-radius: 6px; padding: 56px 68px; font-size: 14px; line-height: 2; color: var(--text); }
.pv-doc h1 { font-size: 21px; text-align: center; margin-bottom: 6px; }
.pv-doc .byline { text-align: center; color: var(--muted); font-style: italic; font-size: 12.5px; margin-bottom: 30px; }
.pv-doc h2 { font-size: 15.5px; margin: 24px 0 10px; }
.pv-doc p { margin-bottom: 10px; text-indent: 2em; }
.pv-doc ul { padding-left: 26px; margin-bottom: 10px; }
.pv-slides { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; align-self: center; width: 100%; max-width: 640px; }
.pv-slide { aspect-ratio: 16/9; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, #fff, #f6f6f8); padding: 16px; font-size: 13px; color: #333; }
.pv-slide i { display: block; height: 7px; border-radius: 4px; background: var(--line-soft); margin-top: 9px; }
.pv-slide.cover { background: linear-gradient(135deg, var(--accent-soft), rgba(14,181,121,.02)); display: grid; place-items: center; font-size: 16px; font-weight: 700; color: var(--accent-deep); }
.pv-nosupp { display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 13px; width: 100%; height: 100%; }
.pv-statusbar { height: 30px; flex-shrink: 0; display: flex; align-items: center; gap: 18px; padding: 0 16px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ============ 删除确认弹窗 ============ */
.dlg-mask { position: fixed; inset: 0; z-index: 170; background: rgba(0,0,0,.32); display: grid; place-items: center; }

.dlg {

.dlg-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #e5484d; }
.dlg-body { font-size: 14px; font-weight: 600; color: var(--text); margin: 14px 0 4px; }
.dlg-desc { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.dlg-btn { height: 32px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; color: #333; }
.dlg-btn:hover { background: #fafafa; }
.dlg-btn.danger { background: #e5484d; border-color: #e5484d; color: #fff; }
.dlg-btn.danger:hover { background: #d63a3f; }
.home-input input { flex: 1; border: none; outline: none; font-size: 14px; padding: 10px 0; background: transparent; }
.send-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.send-btn:hover { background: var(--hover); color: var(--text); }
.ws-row { margin-top: 10px; }
.ws-btn {

  font-size: 12px; color: #555;
  background: var(--side-bg); border: 1px solid var(--line);

::-webkit-scrollbar { width: 8px; }

</style>

function applyFilter(list) {

function groupedHtml(list, mode) {
  let html = '';

  for (const ws of workspaces) {
    const closed = state.closedWs[ws];
    const wsFiles = sortList(list.filter(f => f.ws === ws));
    const convs = [...new Set(wsFiles.map(f => f.conv))];
    html += `<div class="kb-grp-row ${closed ? 'closed' : ''}" data-ws="${ws}">
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>

    if (closed) continue;
    for (const conv of convs) {
      const cf = wsFiles.filter(f => f.conv === conv);
      html += `<div class="kb-grp-row conv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>${conv}</span></div>`;

        ? `<div class="kb-grid" style="margin:4px 0 8px">${cf.map(cardHtml).join('')}</div>`
        : cf.map(f => rowHtml(f, 'recent', 2)).join('');
    }
  }
  const ungrouped = list.filter(f => !f.ws);
  if (ungrouped.length) {
    const closed = state.closedWs['__tpl'];
    html += `<div class="kb-grp-row ${closed ? 'closed' : ''}" data-ws="__tpl">
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>

        : ungrouped.map(f => rowHtml(f, 'recent')).join('');

  }
  return html;
}

/* ============ 沉淀（版本覆盖） ============ */
function saveOne(id) {
  const f = FILES.find(x => x.id === id);
  if (f.saved) { /* 已沉淀的星标 = 再次沉淀更新（快照刷新） */
    touch(id); f.time = '刚刚'; f.timeN = 0; renderAll();
    toast(`「${f.name}」快照已更新`);
    return;
  }
  /* 同会话 + 同名 → 覆盖旧版，版本 +1 */
  const dup = savedFiles().find(x => x.conv === f.conv && x.name === f.name);
  if (dup) { dup.saved = false; f.ver = dup.ver + 1; }
  f.saved = true;
  renderAll();
  toast(dup ? `已更新至 v${f.ver}，已覆盖旧版` : '已沉淀到我的资料');
}

function editFile(id) {
  const f = FILES.find(x => x.id === id);
  if (!f) return;
  f.edits = (f.edits || 0) + 1;
  if (f.saved) { /* 热更新：已沉淀的资料始终展示最新修改 */
    f.time = '刚刚'; f.timeN = 0;
    if (state.page === 'lib') renderAll();
    return;
  }
  if (!state.autoSink || f.edits < 3 || f.sinkTimer) return;
  f.sinkTimer = setTimeout(() => { /* 模拟 24h 冷却期 */
    f.sinkTimer = null;
    if (f.saved || !FILES.includes(f)) return;
    f.saved = true; f.time = '刚刚'; f.timeN = 0;
    showBanner(`「${f.name}」已为您自动沉淀至资料库`, [
      { label: '撤回', cb: () => { f.saved = false; f.edits = 0; if (state.page === 'lib') renderAll(); toast('已撤回，文件回到「本地产物」'); } },
    ]);
    if (state.page === 'lib') renderAll();
  }, 4000);
}

function msgHtml(m) {
  if (m.role === 'user') return `<div class="msg-user">${m.text}</div>`;
  if (m.role === 'rag') return `<div class="msg-rag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>已检索知识库</div>`;
  if (m.role === 'file') {
    const f = FILES.find(x => x.id === m.fid);
    if (!f) return '';
    return `<div class="file-card">
      <span class="att-icon" style="background:${f.color}">${f.ext.toUpperCase()}</span>
      <span class="att-txt"><div class="att-name">${f.name}</div>${f.saved ? '<div class="att-ext">已保存到「我的资料」</div>' : ''}</span>
      <button class="kb-ic-btn star ${f.saved ? 'on' : ''}" data-cstar="${f.id}" title="${f.saved ? '更新快照到我的资料' : '沉淀到我的资料'}">${svgStar(f.saved)}</button>
      <button class="chat-ow" data-cow="${f.id}">打开方式 ▾</button>
    </div>`;
  }
  return `<div class="msg-ai">${m.text.replace(/\n/g, '<br>')}</div>`;
}
function workHtml() {
  return `<div class="msg-work"><svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.56"/></svg>kerker 正在认真工作</div>`;
}
function sendTask() {
  const inp = $('#homeInput') || $('#chatInput');
  if (!inp || home.working) return;
  const text = inp.value.trim();
  if (!text) return;
  if (!home.messages.length) home.title = text.length > 16 ? text.slice(0, 16) + '…' : text;
  home.messages.push({ role: 'user', text });
  home.working = true;
  inp.value = '';
  render();
  const domain = (text.match(/「(.+?)」/) || [])[1] || '';
  const smallTalk = /^(你好|您好|hi|hello|嗨|在吗|哈喽)[!！。~～\s]*$/i.test(text) || text.length <= 4;
  const optOut = /不要|不用|别用|别管|无需|跳过|无视/.test(text) && /资料|知识|检索|参考|之前|已有/.test(text);
  let ragHit = false;
  const t = (fn, ms) => home.timers.push(setTimeout(fn, ms));
  if (smallTalk) {
    t(() => { home.messages.push({ role: 'ai', text: '你好！有什么想深入了解的领域吗？可以让我帮你整理成资料 📚' }); home.working = false; render(); }, 900);
    return;
  }
  t(() => { home.messages.push({ role: 'ai', text: '好的，收到！我先分析一下你的意图…' }); render(); }, 700);
  t(() => {
    const createIntent = !/资料库|知识体系|知识库|整理成资料/.test(text) && /文案|文章|报告|ppt|邮件|周报|总结|方案|计划/.test(text);
    const title = text.replace(/^(帮我|给我|请)/, '').replace(/(生成|写|做|整理)一?[篇份个]?/, '').replace(/[「」"]/g, '').replace(/需要.*$/, '').trim() || (createIntent ? '创作文档' : '通用知识');
    if (state.autoRetrieval && !optOut) ragHit = true;
    const gate = state.autoRetrieval && !optOut ? '，命中知识库检索' : optOut ? '：你明确表示不结合已有资料，已跳过知识库检索' : state.autoRetrieval ? '' : '，自动检索未开启，跳过';
    const step3 = createIntent ? `生成「${title}」` : '生成结构化资料文档';
    home.messages.push({ role: 'ai', text: optOut
      ? `1️⃣ 意图分析${gate}\n2️⃣ 仅基于本次对话内容\n3️⃣ ${step3}`
      : `1️⃣ 意图分析：${createIntent ? '内容创作类' : '知识构建类'}请求${gate}\n2️⃣ ${state.autoRetrieval && !optOut ? '检索本机与「我的资料」中的相关素材' : '梳理已有上下文'}\n3️⃣ ${step3}` });
    render();
  }, 1800);
  t(() => {
    const createIntent = !/资料库|知识体系|知识库|整理成资料/.test(text) && /文案|文章|报告|ppt|邮件|周报|总结|方案|计划/.test(text);
    const title = text.replace(/^(帮我|给我|请)/, '').replace(/(生成|写|做|整理)一?[篇份个]?/, '').replace(/[「」"]/g, '').replace(/需要.*$/, '').trim() || (createIntent ? '创作文档' : '通用知识');
    const f = createIntent
      ? { id: fileSeq++, name: `${title}.md`, ext: 'md', color: '#0db98a', size: '3 KB', sizeN: .1, ws: null, conv: home.title || '对话', time: '刚刚', timeN: 0, opened: 0, saved: false, ver: 1, tags: [] }
      : { id: fileSeq++, name: `「${domain || title}」领域资料库.md`, ext: 'md', color: '#4a8cf7', size: '86 KB', sizeN: .1, ws: null, conv: 'AI 生成', time: '刚刚', timeN: 0, opened: 0, saved: true, ver: 1, tags: ['资料库'] };
    FILES.push(f);
    home.messages.push({ role: 'ai', text: createIntent
      ? `「${title}」已生成完成 ✅ 开头钩子与正文结构参考了你沉淀的资料，可以直接使用，也可以让我继续调整风格。`
      : `「${domain || title}」资料库已生成完成 ✅ 包含：核心概念定义、知识体系框架、经典书籍与论文清单、常用工具与方法论、学习路径五个部分。` });
    if (ragHit) home.messages.push({ role: 'rag' });
    home.messages.push({ role: 'file', fid: f.id });
    home.working = false;
    if (state.page === 'lib') renderAll();
    render();
  }, 3400);
}
function stopSim() {
  home.timers.forEach(clearTimeout);
  home.timers = [];
  home.working = false;
  home.messages.push({ role: 'ai', text: '已停止。随时告诉我继续。' });
  render();
}

/* ============ Page render ============ */
function renderSettings() {
  const sw = (id, on) => `<button class="tg-switch ${on ? 'on' : ''}" data-set="${id}"><span class="tg-dot"></span></button>`;
  $('#setPage').innerHTML = `
    <div class="set-wrap">
      <button class="set-back" onclick="state.page='lib';render()">‹ 返回应用</button>
      <h2 class="set-h2">偏好设置</h2>
      <div class="set-card">
        <div class="set-row"><div><div class="set-name">自动预览成果物</div></div>${sw('autoPreview', state.autoPreview)}</div>
      </div>
      <h2 class="set-h2">资料库</h2>
      <div class="set-card">
        <div class="set-row">
          <div><div class="set-name">自动沉淀资料</div><div class="set-desc">文档修改 ≥3 次且 24 小时未动时，自动沉淀到「我的资料」；多次复用或被认可时主动询问</div></div>
          ${sw('autoSink', state.autoSink)}
        </div>
        <div class="set-row">
          <div><div class="set-name">自动检索资料库</div><div class="set-desc">开启后先对输入做意图分析，命中资料类意图时才检索「我的资料」并在回答中标注引用；检索使用最低推理强度，控制消耗</div></div>
          ${sw('autoRetrieval', state.autoRetrieval)}
        </div>
      </div>
    </div>`;
  $('#setPage').querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
    state[b.dataset.set] = !state[b.dataset.set];
    renderSettings();
  });
}
function render() {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.nav === '资料库' && state.page === 'lib'));
  $('#libPage').classList.toggle('hidden', state.page !== 'lib');
  $('#homePage').classList.toggle('hidden', state.page !== 'home');
  $('#setPage').classList.toggle('hidden', state.page !== 'settings');
  if (state.page === 'home') renderHome();
  else if (state.page === 'settings') renderSettings();
  else renderAll();
}

/* ============ Toast / Menus ============ */
let toastTimer;
function toast(msg) {
  const t = $('#toastEl');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
function closeMenus() { document.querySelectorAll('.menu').forEach(m => m.classList.remove('show')); }

/* ============ Events ============ */
document.querySelectorAll('.kb-tab').forEach(n => n.onclick = () => {
  state.knav = n.dataset.knav;
  state.expand = null;
  renderAll();
});
$('#kbSearch').oninput = e => { state.q = e.target.value.trim(); renderContent(); };
$('#kbTypeBtn').onclick = e => {
  e.stopPropagation();
  const m = $('#typeMenu');
  const open = m.classList.contains('show');
  closeMenus();
  if (!open) { const r = e.currentTarget.getBoundingClientRect(); m.style.top = r.bottom + 6 + 'px'; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 216)) + 'px'; m.classList.add('show'); }
};
$('#typeMenu').innerHTML = TYPE_OPTIONS.map(t => `<button class="menu-item" data-type="${t}">${t}</button>`).join('');
$('#typeMenu').onclick = e => {
  const b = e.target.closest('[data-type]');
  if (!b) return;
  state.type = b.dataset.type;
  closeMenus();
  renderTabs();
  renderContent();
};
$('#kbSortBtn').onclick = e => {
  e.stopPropagation();
  const m = $('#sortMenu');
  const open = m.classList.contains('show');
  closeMenus();
  if (!open) { const r = e.currentTarget.getBoundingClientRect(); m.style.top = r.bottom + 6 + 'px'; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 216)) + 'px'; m.classList.add('show'); }
};
$('#sortMenu').innerHTML = [['time', '最近更新'], ['name', '按名称'], ['size', '按大小']]
  .map(([v, label]) => `<button class="menu-item" data-sort="${v}">${label}</button>`).join('');
$('#sortMenu').onclick = e => {
  const b = e.target.closest('[data-sort]');
  if (!b) return;
  state.sort = b.dataset.sort;
  closeMenus();
  renderTabs();
  renderContent();
};
function bindContent() {
  const el = $('#kbContent');
  el.querySelectorAll('[data-fid]').forEach(n => n.onclick = e => {
    if (e.target.closest('[data-save],[data-preview],[data-openwith],[data-rmfrom]')) return;
    previewWindow(+n.dataset.fid);
  });
  el.querySelectorAll('[data-fid]').forEach(n => n.oncontextmenu = e => {
    e.preventDefault();
    openOpenWith(+n.dataset.fid, e.clientX, e.clientY);
  });
  el.querySelectorAll('[data-ws]').forEach(n => n.onclick = () => {
    const ws = n.dataset.ws;
    state.closedWs[ws] = !state.closedWs[ws];
    renderContent();
  });
  el.querySelectorAll('[data-fold]').forEach(n => n.onclick = e => {
    if (e.target.closest('[data-preview],[data-rmfrom]')) return;
    const id = n.dataset.fold;
    state.expand = state.expand && state.expand.t === 'folder' && state.expand.id === id ? null : { t: 'folder', id };
    renderContent();
  });
  el.querySelectorAll('[data-task]').forEach(b => b.onclick = e => { e.stopPropagation(); addToTask(+b.dataset.task); });
  el.querySelectorAll('[data-openwith]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const r = b.getBoundingClientRect();
    openOpenWith(+b.dataset.openwith, r.left - 160, r.bottom + 6);
  });
  el.querySelectorAll('[data-more]').forEach(b => b.onclick = e => { e.stopPropagation(); openMoreMenu(+b.dataset.more, b); });
  el.querySelectorAll('[data-fmore]').forEach(b => b.onclick = e => { e.stopPropagation(); openFolderMenu(b.dataset.fmore, b); });
  $('#kbGroupBtn').onclick = () => { state.groupConv = !state.groupConv; renderAll(); };
  el.querySelectorAll('[data-save]').forEach(b => b.onclick = e => { e.stopPropagation(); saveOne(+b.dataset.save); });
  el.querySelectorAll('[data-rmfrom]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const [fdId, fid] = b.dataset.rmfrom.split(':');
    const fd = FOLDERS.find(x => x.id === fdId);
    fd.files = fd.files.filter(x => x !== +fid);
    delete FILES.find(x => x.id === +fid).folderId;
    renderAll(); toast('已从文件夹移出');
  });
}
$('#kbNewBtn').onclick = e => {
  e.stopPropagation();
  const m = $('#newMenu');
  const open = m.classList.contains('show');
  closeMenus();
  if (!open) { const r = e.currentTarget.getBoundingClientRect(); m.style.top = r.bottom + 6 + 'px'; m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 216)) + 'px'; m.classList.add('show'); }
};
$('#settingsBtn').onclick = e => { e.stopPropagation(); state.page = 'settings'; render(); };
$('#homePage').onclick = e => {
  const x = e.target.closest('[data-rmchip]');
  if (x) { home.chips = home.chips.filter(f => f.id !== +x.dataset.rmchip); render(); }
};
$('#newTaskBtn').onclick = () => { home = freshHome(); state.page = 'home'; render(); };
$('#newMenu').onclick = e => {
  const b = e.target.closest('[data-nm]');
  if (!b) return;
  closeMenus();
  const act = b.dataset.nm;
  if (act === 'folder') createFolder();
  else if (act === 'upload') toast('原型演示：打开系统文件选择器上传');
  else if (act === 'ai-sink') aiSink();
};
$('#chatPlusMenu').onclick = e => {
  const b = e.target.closest('[data-cp]');
  if (!b) return;
  closeMenus();
  if (b.dataset.cp === 'lib') openPicker();
  else if (b.dataset.cp === 'file') toast('原型演示：打开系统文件选择器');
  else toast('原型演示：选择专家');
};
$('#pickerMask').onclick = e => { if (e.target === e.currentTarget) closePicker(); };
document.querySelectorAll('.nav-item').forEach(n => n.onclick = () => {
  if (n.dataset.nav !== '资料库') toast(`原型演示：切换到「${n.dataset.nav}」`);
  else { state.page = 'lib'; render(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.menu') && !e.target.closest('#kbNewBtn') && !e.target.closest('#kbSortBtn')) closeMenus(); });

render();
</script></body>
</html>
